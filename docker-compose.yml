version: "3.9"

x-public-dns: &public_dns
  dns:
    - 8.8.8.8
    - 1.1.1.1

services:
  clickhouse:
    <<: *public_dns
    image: clickhouse/clickhouse-server:24
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  page-indexer:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/page_indexer/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"

  page-indexer-trigger:
    <<: *public_dns
    build:
      context: .
      dockerfile: jobs/page_indexer_trigger/Dockerfile
    env_file:
      - .env
    environment:
      PAGE_INDEXER_URL: http://page-indexer:8000/
    profiles:
      - trigger
    restart: "no"

  page-indexer-retry:
    <<: *public_dns
    build:
      context: .
      dockerfile: jobs/indexer_retry/Dockerfile
    env_file:
      - .env
    environment:
      PAGE_INDEXER_URL: http://page-indexer:8000
    profiles:
      - trigger
    restart: "no"

  page-processor-oneoff:
    <<: *public_dns
    build:
      context: .
      dockerfile: jobs/page_processor/jobs/one_off/Dockerfile
    env_file:
      - .env
    profiles:
      - trigger
    restart: "no"

  metabase:
    <<: *public_dns
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /home/metabase/data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/home/metabase/data
    restart: unless-stopped

  nli-service:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/nli_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8000"

  llm-engine:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/llm_engine/Dockerfile
      secrets:
        - guardrails_token
    env_file:
      - .env
    environment:
      NLI_URL: http://nli-service:8000/nli
      RERANKER_URL: http://reranker-service:8000/rerank
    restart: unless-stopped
    ports:
      - "8200:8000"

  reranker-service:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/reranker_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8090:8000"

secrets:
  guardrails_token:
    file: .secrets/guardrails_token

volumes:
  metabase-data:
  clickhouse-data:
