version: "3.9"

x-public-dns: &public_dns
  dns:
    - 8.8.8.8
    - 1.1.1.1

services:
  page-indexer:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/page_indexer/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-indexer-trigger:
    <<: *public_dns
    build:
      context: .
      dockerfile: jobs/page_indexer_trigger/Dockerfile
    env_file:
      - .env
    environment:
      PAGE_INDEXER_URL: http://page-indexer:8000/
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-processor-oneoff:
    <<: *public_dns
    build:
      context: .
      dockerfile: jobs/page_processor/jobs/one_off/Dockerfile
    env_file:
      - .env
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  metabase:
    <<: *public_dns
    image: metabase_duckdb:latest
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /home/metabase/data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/home/metabase/data
      - ./metrics.duckdb:/home/metabase/data/metrics.duckdb

  nli-service:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/nli_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  llm-engine:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/llm_engine/Dockerfile
      secrets:
        - guardrails_token
    env_file:
      - .env
    environment:
      NLI_URL: http://nli-service:8000/nli
      RERANKER_URL: http://reranker-service:8000/rerank
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  reranker-service:
    <<: *public_dns
    build:
      context: .
      dockerfile: services/reranker_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8090:8000"

secrets:
  guardrails_token:
    file: .secrets/guardrails_token

volumes:
  metabase-data:
