version: "3.9"

services:
  page-indexer:
    build:
      context: .
      dockerfile: services/page_indexer/Dockerfile
      args:
        GUARDRAILS_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJnb29nbGUtb2F1dGgyfDEwNDE0MzgxNDA0MDkyNTAxNDkyMSIsImFwaUtleUlkIjoiMmM1YjkxOWItN2E2Ny00NjhmLTkxMGYtNDk1OWMyZDgwYjQ5Iiwic2NvcGUiOiJyZWFkOnBhY2thZ2VzIiwicGVybWlzc2lvbnMiOltdLCJpYXQiOjE3Njk1NzA1ODAsImV4cCI6NDkyMzE3MDU4MH0.qYVR0xBpm7D3cL-sMa1xforv45UGdrBLADsk5JLUJZc
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-indexer-trigger:
    build:
      context: .
      dockerfile: jobs/page_indexer_trigger/Dockerfile
    env_file:
      - .env
    environment:
      PAGE_INDEXER_URL: http://page-indexer:8000/
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-processor-oneoff:
    build:
      context: .
      dockerfile: jobs/page_processor/jobs/one_off/Dockerfile
    env_file:
      - .env
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  metabase:
    image: metabase_duckdb:latest
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /home/metabase/data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/home/metabase/data
      - ./metrics.duckdb:/home/metabase/data/metrics.duckdb

  nli-service:
    build:
      context: .
      dockerfile: services/nli_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  llm-engine:
    build:
      context: .
      dockerfile: services/llm_engine/Dockerfile
    env_file:
      - .env
    environment:
      NLI_URL: http://nli-service:8080/nli
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - metabase-data:/home/metabase/data
      - ./metrics.duckdb:/home/metabase/data/metrics.duckdb

volumes:
  metabase-data:
