version: "3.9"

services:
  page-indexer:
    build:
      context: .
      dockerfile: services/page_indexer/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-indexer-trigger:
    build:
      context: .
      dockerfile: jobs/page_indexer_trigger/Dockerfile
    env_file:
      - .env
    environment:
      PAGE_INDEXER_URL: http://page-indexer:8000/
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  page-processor-oneoff:
    build:
      context: .
      dockerfile: jobs/page_processor/jobs/one_off/Dockerfile
    env_file:
      - .env
    profiles:
      - trigger
    restart: "no"
    volumes:
      - ./metrics.duckdb:/data/metrics.duckdb

  metabase:
    image: metabase_duckdb:latest
    environment:
      MB_SETUP_TOKEN: skip
      MB_ANON_TRACKING_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
      - ./metrics.duckdb:/data/metrics.duckdb

volumes:
  metabase-data:
