apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-indexer
  namespace: nucleus-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: page-indexer
  template:
    metadata:
      labels:
        app: page-indexer
    spec:
      containers:
        - name: page-indexer
          image: nucleus-ai-page-indexer:latest
          envFrom:
            - configMapRef:
                name: nucleus-ai-env
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: page-indexer
  namespace: nucleus-ai
spec:
  selector:
    app: page-indexer
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
